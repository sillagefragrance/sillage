<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Scent – Sillage</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --lilac: #C8A8D8;
    --deep-plum: #5C2D6E;
    --mid-plum: #8B4FA6;
    --soft-lilac: #EDE0F5;
    --cream: #FAF6F0;
    --warm-cream: #F5EDE0;
    --text-dark: #2C1A35;
    --text-mid: #6B4D7A;
    --text-light: #9E7FB0;
    --white: #FFFFFF;
    --card-bg: rgba(255,255,255,0.85);
    --shadow: 0 4px 32px rgba(92,45,110,0.10);
    --shadow-hover: 0 8px 40px rgba(92,45,110,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background orbs */
  body::before {
    content: '';
    position: fixed;
    top: -120px; right: -120px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,168,216,0.22) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,79,166,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .quiz-wrap {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  .quiz-header {
    text-align: center;
    margin-bottom: 48px;
  }
  .quiz-header .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--mid-plum);
    text-decoration: none;
    text-transform: uppercase;
    display: block;
    margin-bottom: 20px;
  }
  .quiz-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-weight: 400;
    color: var(--deep-plum);
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .quiz-header p {
    font-size: 0.95rem;
    color: var(--text-light);
    font-weight: 300;
  }

  /* Progress bar */
  .progress-bar-wrap {
    margin-bottom: 40px;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .progress-track {
    height: 3px;
    background: rgba(200,168,216,0.25);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--lilac), var(--mid-plum));
    border-radius: 99px;
    transition: width 0.5s ease;
  }

  /* Question card */
  .question-card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 40px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(200,168,216,0.3);
    animation: fadeUp 0.4s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-step {
    font-size: 0.72rem;
    color: var(--text-light);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .q-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.35rem, 3.5vw, 1.75rem);
    font-weight: 400;
    color: var(--deep-plum);
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .q-sub {
    font-size: 0.88rem;
    color: var(--text-light);
    margin-bottom: 28px;
    font-weight: 300;
  }

  /* Options grid */
  .options-grid {
    display: grid;
    gap: 12px;
  }
  .options-grid.two-col { grid-template-columns: 1fr 1fr; }
  .options-grid.one-col { grid-template-columns: 1fr; }

  .option-btn {
    background: var(--white);
    border: 1.5px solid rgba(200,168,216,0.4);
    border-radius: 14px;
    padding: 16px 20px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .option-btn:hover {
    border-color: var(--lilac);
    background: var(--soft-lilac);
    transform: translateY(-1px);
    box-shadow: var(--shadow-hover);
  }
  .option-btn.selected {
    border-color: var(--mid-plum);
    background: linear-gradient(135deg, rgba(200,168,216,0.2), rgba(139,79,166,0.08));
    box-shadow: 0 0 0 3px rgba(139,79,166,0.12);
  }
  .option-btn.dislike-selected {
    border-color: #d48a8a;
    background: rgba(212,138,138,0.08);
  }

  .option-emoji { font-size: 1.4rem; flex-shrink: 0; margin-top: 1px; }
  .option-text {}
  .option-label {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-dark);
    display: block;
    margin-bottom: 2px;
  }
  .option-desc {
    font-size: 0.80rem;
    color: var(--text-light);
    font-weight: 300;
    line-height: 1.4;
  }

  /* Nav buttons */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }
  .btn-back {
    background: none;
    border: 1.5px solid rgba(200,168,216,0.5);
    border-radius: 12px;
    padding: 12px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-back:hover { border-color: var(--lilac); color: var(--mid-plum); }
  .btn-back:disabled { opacity: 0.3; pointer-events: none; }

  .btn-next {
    background: linear-gradient(135deg, var(--mid-plum), var(--deep-plum));
    border: none;
    border-radius: 12px;
    padding: 13px 32px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.93rem;
    font-weight: 500;
    color: var(--white);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
    flex: 1;
    max-width: 240px;
    margin-left: auto;
  }
  .btn-next:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(92,45,110,0.28); }
  .btn-next:disabled { opacity: 0.4; pointer-events: none; }

  /* Results */
  .results-card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 40px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(200,168,216,0.3);
    animation: fadeUp 0.5s ease both;
    text-align: center;
  }
  .results-eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 10px;
  }
  .results-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    color: var(--deep-plum);
    font-weight: 400;
    margin-bottom: 32px;
  }

  .match-main {
    background: linear-gradient(135deg, rgba(200,168,216,0.18), rgba(139,79,166,0.08));
    border: 1.5px solid rgba(139,79,166,0.25);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 24px;
    text-align: left;
  }
  .match-tag {
    display: inline-block;
    background: var(--mid-plum);
    color: var(--white);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 14px;
  }
  .match-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.7rem;
    font-weight: 400;
    color: var(--deep-plum);
    margin-bottom: 4px;
  }
  .match-brand {
    font-size: 0.82rem;
    color: var(--text-light);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .match-desc {
    font-size: 0.88rem;
    color: var(--text-mid);
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .match-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .match-pill {
    font-size: 0.78rem;
    color: var(--text-mid);
    background: rgba(200,168,216,0.2);
    border-radius: 99px;
    padding: 4px 12px;
  }

  .also-like-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-weight: 400;
    color: var(--text-mid);
    margin-bottom: 14px;
    font-style: italic;
  }
  .also-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .also-card {
    background: var(--white);
    border: 1.5px solid rgba(200,168,216,0.3);
    border-radius: 16px;
    padding: 18px;
    text-align: left;
  }
  .also-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--deep-plum);
    margin-bottom: 3px;
  }
  .also-brand {
    font-size: 0.75rem;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .also-desc { font-size: 0.80rem; color: var(--text-mid); line-height: 1.4; }

  .btn-retake {
    background: none;
    border: 1.5px solid var(--mid-plum);
    border-radius: 12px;
    padding: 13px 32px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--mid-plum);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .btn-retake:hover { background: var(--soft-lilac); }

  /* Confetti canvas */
  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  @media (max-width: 520px) {
    .question-card, .results-card { padding: 28px 20px; }
    .options-grid.two-col { grid-template-columns: 1fr; }
    .also-grid { grid-template-columns: 1fr; }
    .nav-row { flex-wrap: wrap; }
    .btn-next { max-width: 100%; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

  <div id="quiz-container"></div>
</div>

// ─── QUIZ STATE ──────────────────────────────────────────────────────────────
let state = {
  step: 0,
  occasion: null,
  longevity: null,
  budget: null,
  dislikes: [],
  family: null,
  subfamily: null,
};

const totalSteps = 5;

function progress() {
  const pct = Math.round(((state.step + 1) / totalSteps) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `Step ${state.step + 1} of ${totalSteps}`;
  document.getElementById('prog-pct').textContent = pct + '%';
}

// ─── QUESTIONS ───────────────────────────────────────────────────────────────
const steps = [
  // 0: occasion

      { value: "celebration", emoji: "✨", label: "Celebrations", desc: "Weddings, festivals, parties" },

const familyOptions = {
  floral:   { emoji: "🌸", label: "Floral",       desc: "Romantic and feminine — flowers, petals, blooms" },
  fresh:    { emoji: "💧", label: "Fresh",         desc: "Clean and energising — citrus, green, airy" },
  woody:    { emoji: "🪵", label: "Woody",         desc: "Grounded and earthy — sandalwood, cedar, vetiver" },

};

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  if (state.step >= totalSteps) { showResults(); return; }
  progress();
  const container = document.getElementById('quiz-container');

  // Build family options dynamically (exclude dislikes)
  if (state.step === 4) {
    steps[4].options = Object.entries(familyOptions)
      .filter(([k]) => !state.dislikes.includes(k))
      .map(([k, v]) => ({ value: k, ...v }));
    if (steps[4].options.length === 0) {
      steps[4].options = Object.entries(familyOptions).map(([k,v]) => ({ value: k, ...v }));
    }
  }

  const s = steps[state.step];
  const currentVal = state[s.key];

  let optionsHtml = s.options.map(o => {
    let cls = 'option-btn';
    if (s.multi) {
      if ((currentVal || []).includes(o.value)) cls += ' dislike-selected';
    } else {
      if (currentVal === o.value) cls += ' selected';
    }
    return `<button class="${cls}" data-value="${o.value}" onclick="selectOption(this, '${s.key}', '${o.value}', ${s.multi})">
      <span class="option-emoji">${o.emoji}</span>
      <span class="option-text">
        <span class="option-label">${o.label}</span>
        <span class="option-desc">${o.desc}</span>
      </span>
    </button>`;
  }).join('');

  const canNext = s.multi ? true : !!currentVal;

  container.innerHTML = `
    <div class="question-card">
      <div class="q-step">${s.step}</div>
      <div class="q-title">${s.title}</div>
      <div class="q-sub">${s.sub}</div>
      <div class="options-grid ${s.cols === 2 ? 'two-col' : 'one-col'}">${optionsHtml}</div>
      <div class="nav-row">
        <button class="btn-back" onclick="goBack()" ${state.step === 0 ? 'disabled' : ''}>← Back</button>
        <button class="btn-next" onclick="goNext()" ${canNext || s.multi ? '' : 'disabled'} id="btn-next">
          ${state.step === totalSteps - 1 ? 'See my scent →' : 'Continue →'}
        </button>
      </div>
    </div>`;
}

function selectOption(el, key, value, multi) {
  if (multi) {
    if (!state[key]) state[key] = [];
    const i = state[key].indexOf(value);
    if (i === -1) state[key].push(value);
    else state[key].splice(i, 1);
    // re-render just the buttons
    el.closest('.options-grid').querySelectorAll('.option-btn').forEach(b => {
      b.className = 'option-btn' + (state[key].includes(b.dataset.value) ? ' dislike-selected' : '');
    });
  } else {
    state[key] = value;
    el.closest('.options-grid').querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('btn-next').disabled = false;
  }
}

function goNext() {
  const s = steps[state.step];
  if (!s.multi && !state[s.key]) return;
  state.step++;
  render();
}

function goBack() {
  if (state.step > 0) { state.step--; render(); }
}

// ─── MATCHING ────────────────────────────────────────────────────────────────
function scoreMatch(p) {
  let score = 0;
  // Hard filter
  if (p.price > state.budget) return -Infinity;
  if (state.dislikes.includes(p.family)) return -Infinity;

  // Family match (most important)
  if (p.family === state.family) score += 40;

  // Occasion
  if (p.occasion.includes(state.occasion)) score += 25;

  // Longevity
  if (p.longevity === state.longevity) score += 20;
  else if (
    (state.longevity === 'medium' && (p.longevity === 'long' || p.longevity === 'light')) ||
    (state.longevity === 'long' && p.longevity === 'medium')
  ) score += 8;

  // Budget fit (closer to budget = better use of range)
  const ratio = p.price / state.budget;
  if (ratio >= 0.6) score += 10;

  return score;
}

function getResults() {
  const scored = perfumes
    .map(p => ({ ...p, score: scoreMatch(p) }))
    .filter(p => p.score > -Infinity)
    .sort((a, b) => b.score - a.score);
  return scored;
}

// ─── RESULTS ─────────────────────────────────────────────────────────────────
function showResults() {
  const prog = document.querySelector('.progress-bar-wrap');
  if (prog) prog.style.display = 'none';

  const ranked = getResults();
  if (ranked.length === 0) {
    document.getElementById('quiz-container').innerHTML = `
      <div class="results-card">
        <div class="results-eyebrow">Hmm…</div>
        <div class="results-title">No matches found</div>
        <p style="color:var(--text-light);font-size:0.9rem;margin-bottom:24px;">Try relaxing your dislikes or increasing your budget a little.</p>
        <button class="btn-retake" onclick="retake()">Try again</button>
      </div>`;
    return;
  }

  const top = ranked[0];
  const also = ranked.slice(1, 3);

  const alsoHtml = also.map(p => `
    <div class="also-card">
      <div class="also-name">${p.name}</div>
      <div class="also-brand">${p.brand}</div>
      <div class="also-desc">${p.notes}</div>
    </div>`).join('');

  document.getElementById('quiz-container').innerHTML = `
    <div class="results-card">
      <div class="results-eyebrow">Your perfect match</div>
      <div class="results-title">We found your scent.</div>
      <div class="match-main">
        <span class="match-tag">Perfect match</span>
        <div class="match-name">${top.name}</div>
        <div class="match-brand">${top.brand}</div>
        <div class="match-desc">${top.notes}</div>
        <div class="match-meta">
          <span class="match-pill">₹${top.price.toLocaleString('en-IN')}</span>
          <span class="match-pill">${cap(top.longevity)} lasting</span>
          <span class="match-pill">${cap(top.family)}</span>
          <a href="https://${top.buy}" target="_blank" style="font-size:0.78rem;color:var(--mid-plum);text-decoration:none;padding:4px 12px;background:rgba(139,79,166,0.1);border-radius:99px;">Shop →</a>
        </div>
      </div>
      ${also.length ? `<div class="also-like-title">You may also like…</div><div class="also-grid">${alsoHtml}</div>` : ''}
      <button class="btn-retake" onclick="retake()">← Take the quiz again</button>
    </div>`;

  launchConfetti();
}

function cap(str) { return str ? str[0].toUpperCase() + str.slice(1) : ''; }

function retake() {
  state = { step: 0, occasion: null, longevity: null, budget: null, dislikes: [], family: null, subfamily: null };
  const prog = document.querySelector('.progress-bar-wrap');
  if (prog) prog.style.display = '';
  render();
}

// ─── CONFETTI ────────────────────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#C8A8D8','#8B4FA6','#5C2D6E','#EDE0F5','#D4A0E8','#F5EDE0'];
  const pieces = Array.from({ length: 90 }, () => ({
    x: Math.random() * canvas.width,
    y: -10 - Math.random() * 100,
    r: 4 + Math.random() * 5,
    color: colors[Math.floor(Math.random() * colors.length)],
    speed: 2 + Math.random() * 3,
    drift: (Math.random() - 0.5) * 2,
    spin: (Math.random() - 0.5) * 0.2,
    angle: Math.random() * Math.PI * 2,
  }));

  let frame = 0;
  function animate() {
    if (frame++ > 200) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      p.angle += p.spin;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - frame / 180);
      ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.6);
      ctx.restore();
    });
    requestAnimationFrame(animate);
  }
  animate();
}

// ─── INIT ────────────────────────────────────────────────────────────────────
render();
